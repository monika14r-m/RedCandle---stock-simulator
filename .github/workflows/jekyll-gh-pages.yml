name: Deploy RedCandle to GitHub Pages

on:
  push:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run market-hours regression tests
        run: node --test tests/market-hours.test.mjs
      - name: Check frontend JavaScript syntax
        run: node --check --input-type=module < frontend/script.js
      - name: Validate frontend asset references
        run: python -m unittest discover -s tests -v
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build frontend for GitHub Pages
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./frontend
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
